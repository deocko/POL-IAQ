name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Paquete compartido, API y CAD simulado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  apps:
    name: App ciudadano y web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pol-iaq/shared build
      - run: pnpm --filter @pol-iaq/ciudadano typecheck
      - run: pnpm --filter @pol-iaq/web build
