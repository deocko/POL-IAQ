# Servicios de apoyo para desarrollo local (fase 1 en adelante).
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: poliaq
      POSTGRES_USER: poliaq
      POSTGRES_PASSWORD: poliaq-dev
    ports: ["5432:5432"]
    volumes:
      - ./services/api/db/esquema.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro
  redis:
    image: redis:7
    ports: ["6379:6379"]
