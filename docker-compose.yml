# Servicios de apoyo para desarrollo local. El API crea las tablas al arrancar
# (migraciones en services/api/db/migraciones).
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: poliaq
      POSTGRES_USER: poliaq
      POSTGRES_PASSWORD: poliaq-dev
    ports: ["5432:5432"]
    volumes:
      - poliaq-pg:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports: ["6379:6379"]

volumes:
  poliaq-pg:
